spring:
  config:
    import: "optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:user_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 1000ms

ticket:
  security:
    jwt:
      issuer: ticket-system-test
      secret: ticket-local-demo-jwt-secret-key-please-change
      access-token-expire-seconds: 1800
      refresh-token-expire-seconds: 604800
