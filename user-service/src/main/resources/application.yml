spring:
  config:
    import: "optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}"
  application:
    name: user-service
  cloud:
    nacos:
      discovery:
        enabled: ${TICKET_NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${TICKET_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${TICKET_NACOS_NAMESPACE:public}
        group: ${TICKET_NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${TICKET_NACOS_CONFIG_ENABLED:false}
        server-addr: ${TICKET_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${TICKET_NACOS_NAMESPACE:public}
        group: ${TICKET_NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${TICKET_MYSQL_HOST:127.0.0.1}:${TICKET_MYSQL_PORT:3307}/${TICKET_MYSQL_DATABASE:ticket_system}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TICKET_MYSQL_USERNAME:ticket_app}
    password: ${TICKET_MYSQL_PASSWORD:ticket_app_123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${TICKET_REDIS_HOST:127.0.0.1}
      port: ${TICKET_REDIS_PORT:6379}
      database: ${TICKET_REDIS_DATABASE:0}
      timeout: ${TICKET_REDIS_TIMEOUT:3000ms}

server:
  port: 8081

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

ticket:
  security:
    jwt:
      issuer: ${TICKET_JWT_ISSUER:ticket-system}
      secret: ${TICKET_JWT_SECRET:ticket-local-demo-jwt-secret-key-please-change}
      access-token-expire-seconds: ${TICKET_JWT_ACCESS_EXPIRE_SECONDS:1800}
      refresh-token-expire-seconds: ${TICKET_JWT_REFRESH_EXPIRE_SECONDS:604800}

