spring:
  config:
    import: "optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}"
  application:
    name: seckill-service
  cloud:
    nacos:
      discovery:
        enabled: ${TICKET_NACOS_DISCOVERY_ENABLED:true}
        server-addr: ${TICKET_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${TICKET_NACOS_NAMESPACE:public}
        group: ${TICKET_NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${TICKET_NACOS_CONFIG_ENABLED:true}
        server-addr: ${TICKET_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${TICKET_NACOS_NAMESPACE:public}
        group: ${TICKET_NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml
  datasource:
    url: jdbc:mysql://${TICKET_MYSQL_HOST:127.0.0.1}:${TICKET_MYSQL_PORT:3307}/${TICKET_MYSQL_DATABASE:ticket_system}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${TICKET_MYSQL_USERNAME:ticket_app}
    password: ${TICKET_MYSQL_PASSWORD:ticket_app_123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${TICKET_REDIS_HOST:127.0.0.1}
      port: ${TICKET_REDIS_PORT:6379}
      database: ${TICKET_REDIS_DATABASE:0}
      timeout: ${TICKET_REDIS_TIMEOUT:3000ms}
  rabbitmq:
    host: ${TICKET_RABBITMQ_HOST:127.0.0.1}
    port: ${TICKET_RABBITMQ_PORT:5672}
    username: ${TICKET_RABBITMQ_USERNAME:ticket}
    password: ${TICKET_RABBITMQ_PASSWORD:ticket123}

server:
  port: 8083

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

ticket:
  seckill:
    reservation-expire-seconds: 900
    order-create-retry-enabled: true
    order-create-max-retry-count: 20
    order-create-retry-batch-size: 100
    order-create-retry-interval-seconds: 30
    order-create-retry-cron: 20/20 * * * * ?
    stock-warm-up-enabled: true
    lua:
      reserve-script-location: classpath:lua/seckill/reserve-stock.lua

