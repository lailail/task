spring:
  config:
    import: "optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}"
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:order_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  rabbitmq:
    listener:
      simple:
        auto-startup: false

ticket:
  order:
    result-max-retry-count: 20
    result-retry-batch-size: 100
    result-retry-interval-seconds: 30
    result-retry-cron: 10/20 * * * * ?
    mq:
      create-queue: ticket.order.create.queue
      payment-result-queue: ticket.payment.result.queue
