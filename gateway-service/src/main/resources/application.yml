spring:
  config:
    import: "optional:nacos:${spring.application.name}.${spring.cloud.nacos.config.file-extension}"
  application:
    name: gateway-service
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service-route
              uri: lb://user-service
              predicates:
                - Path=/api/v1/users/**
            - id: ticket-service-route
              uri: lb://ticket-service
              predicates:
                - Path=/api/v1/activities/**
            - id: seckill-service-route
              uri: lb://seckill-service
              predicates:
                - Path=/api/v1/seckill/**
    nacos:
      discovery:
        enabled: ${TICKET_NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${TICKET_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${TICKET_NACOS_NAMESPACE:public}
        group: ${TICKET_NACOS_GROUP:DEFAULT_GROUP}
      config:
        enabled: ${TICKET_NACOS_CONFIG_ENABLED:false}
        server-addr: ${TICKET_NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${TICKET_NACOS_NAMESPACE:public}
        group: ${TICKET_NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yaml

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

ticket:
  security:
    jwt:
      issuer: ${TICKET_JWT_ISSUER:ticket-system}
      secret: ${TICKET_JWT_SECRET:ticket-local-demo-jwt-secret-key-please-change}
      access-token-expire-seconds: ${TICKET_JWT_ACCESS_EXPIRE_SECONDS:1800}
      refresh-token-expire-seconds: ${TICKET_JWT_REFRESH_EXPIRE_SECONDS:604800}
    gateway:
      permit-paths:
        - /api/v1/users/register
        - /api/v1/users/login
        - /api/v1/users/token/refresh
        - /api/v1/activities/**
        - /actuator/**

